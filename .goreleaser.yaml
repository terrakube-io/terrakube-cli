# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: terrakube

before:
  hooks:
    - go mod tidy

builds:
  - id: terrakube
    binary: terrakube
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X terrakube/cmd.Version={{ .Version }}
      - -X terrakube/cmd.Commit={{ .Commit }}
      - -X terrakube/cmd.Date={{ .Date }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      # Match current exclusions from the release matrix
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: "386"

archives:
  - id: default
    name_template: "terrakube_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "terrakube_{{ .Version }}_checksums.txt"

# ---------------------------------------------------------------------------
# Docker — multi-arch images (amd64 + arm64), pushed to Docker Hub
# dockers_v2 uses buildx natively to create a single multi-arch manifest,
# eliminating the need for per-arch entries and a separate docker_manifests block.
# ---------------------------------------------------------------------------
dockers_v2:
  - images:
      - "docker.io/azbuilder/terrakube-cli"
    # Uses a dedicated Dockerfile that copies the pre-built binary from
    # GoReleaser's build context (${TARGETOS}/${TARGETARCH}/terrakube).
    # The main Dockerfile builds from source and cannot be used here because
    # GoReleaser's context only contains the binary, not the full source tree.
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - latest

# ---------------------------------------------------------------------------
# Snap — builds via snapcraft CLI and publishes to the Snap Store
# Channel is injected at runtime via GORELEASER_SNAP_CHANNEL env var
# (computed in the workflow step before GoReleaser runs)
# ---------------------------------------------------------------------------
snapcrafts:
  - name: terrakube-cli
    summary: CLI tool for Terrakube
    description: |
      Tool to handle Terrakube organization configurations.
    grade: stable
    confinement: strict
    license: Apache-2.0
    publish: true
    channel_templates:
      - "{{ .Env.GORELEASER_SNAP_CHANNEL }}"
    apps:
      terrakube-cli:
        command: terrakube
        plugs:
          - home
          - network

# ---------------------------------------------------------------------------
# Homebrew — formula pushed to the terrakube-io/homebrew-cli tap
# `brew install terrakube-io/cli/terrakube`
# ---------------------------------------------------------------------------
brews:
  - name: terrakube
    repository:
      owner: terrakube-io
      name: homebrew-cli
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/terrakube-io/terrakube-cli
    description: Command-line interface for Terrakube
    license: Apache-2.0
    commit_msg_template: "terrakube {{ .Tag }}"
    install: |
      bin.install "terrakube"
    test: |
      assert_match version.to_s, shell_output("#{bin}/terrakube --version")

# ---------------------------------------------------------------------------
# Chocolatey — `choco install terrakube`. The package downloads the release's
# Windows zips. The release workflow puts a Docker-based `choco` on PATH
# (.github/scripts/choco).
# ---------------------------------------------------------------------------
chocolateys:
  - name: terrakube
    title: Terrakube CLI
    authors: Terrakube contributors
    owners: terrakube
    project_url: https://github.com/terrakube-io/terrakube-cli
    license_url: https://github.com/terrakube-io/terrakube-cli/blob/main/LICENSE
    require_license_acceptance: false
    project_source_url: https://github.com/terrakube-io/terrakube-cli
    package_source_url: https://github.com/terrakube-io/terrakube-cli
    docs_url: https://github.com/terrakube-io/terrakube-cli#readme
    bug_tracker_url: https://github.com/terrakube-io/terrakube-cli/issues
    tags: terrakube terraform opentofu iac cli
    summary: Command-line interface for Terrakube
    description: |
      The `terrakube` command manages a Terrakube server from the terminal:
      organizations, workspaces, variables, modules, runs and jobs, policies,
      state and tokens. Log in with `terrakube login`.
    release_notes: "https://github.com/terrakube-io/terrakube-cli/releases/tag/{{ .Tag }}"
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: https://push.chocolatey.org/

# ---------------------------------------------------------------------------
# GitHub Release — upload artifacts to the already-created release
# GoReleaser detects the existing release from GITHUB_REF and uploads to it
# ---------------------------------------------------------------------------
release:
  skip_upload: false
