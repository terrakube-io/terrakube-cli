name: Release check

# Builds a snapshot release (archives, Homebrew formula)
# without publishing, so release config changes are tested before a release.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml
      - .github/workflows/release-check.yml

permissions:
  contents: read

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build a snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean --skip=docker,snapcraft
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: unused
          GORELEASER_SNAP_CHANNEL: latest/edge

      - name: Show the Homebrew formula
        run: cat dist/homebrew/Formula/terrakube.rb
