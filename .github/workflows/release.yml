name: Release

on:
  release:
    types: [created]

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Determine Snap Channel
        id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ -rc ]]; then
            CHANNEL="latest/candidate"
          elif [[ "$TAG" =~ -beta ]]; then
            CHANNEL="latest/beta"
          elif [[ "$TAG" =~ - ]]; then
            CHANNEL="latest/edge"
          else
            CHANNEL="latest/stable"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG -> Snap Channel: $CHANNEL"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Put choco on PATH
        run: echo "$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes Formula/terrakube.rb to terrakube-io/homebrew-cli.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GORELEASER_SNAP_CHANNEL: ${{ steps.channel.outputs.channel }}

      - name: Update Snap Store Metadata
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(find dist/ -name "*.snap" | head -n 1)
          if [ -n "$SNAP_FILE" ]; then
            echo "Uploading metadata from: $SNAP_FILE"
            snapcraft upload-metadata "$SNAP_FILE" --force
          else
            echo "No snap package found in dist/"
            exit 1
          fi

      # Kept out of GoReleaser so that push.chocolatey.org being slow or down
      # (it answered 504 for v1.0.0-rc.1) does not fail the release and skip
      # packslip. The step still shows as failed in the run.
      - name: Push the Chocolatey package
        continue-on-error: true
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          set -u
          pkg=$(find dist -maxdepth 1 -name '*.nupkg' | head -n 1)
          if [ -z "$pkg" ]; then echo "::error::no .nupkg in dist/"; exit 1; fi
          for attempt in 1 2 3; do
            if out=$(choco push "$pkg" --source https://push.chocolatey.org/ --api-key "$CHOCOLATEY_API_KEY" 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            # A retry after a timeout can find the package already uploaded.
            if echo "$out" | grep -q '409'; then
              echo "The package is already on Chocolatey."
              exit 0
            fi
            echo "Attempt $attempt failed."
            [ "$attempt" -lt 3 ] && sleep 60
          done
          echo "::error::Pushing $pkg to Chocolatey failed; push it manually with choco push."
          exit 1

  packslip:
    name: packslip
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload packslip.sigstore.json to the release
      id-token: write # sign keylessly with this workflow's identity
      attestations: write # build provenance for each archive
    steps:
      - name: Sign the release archives
        uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          download: terrakube_*_*.tar.gz terrakube_*_*.zip
          bin: terrakube
