name: Release

on:
  release:
    types: [created]

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Determine Snap Channel
        id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ -rc ]]; then
            CHANNEL="latest/candidate"
          elif [[ "$TAG" =~ -beta ]]; then
            CHANNEL="latest/beta"
          elif [[ "$TAG" =~ - ]]; then
            CHANNEL="latest/edge"
          else
            CHANNEL="latest/stable"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG -> Snap Channel: $CHANNEL"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GORELEASER_SNAP_CHANNEL: ${{ steps.channel.outputs.channel }}

      - name: Update Snap Store Metadata
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(find dist/ -name "*.snap" | head -n 1)
          if [ -n "$SNAP_FILE" ]; then
            echo "Uploading metadata from: $SNAP_FILE"
            snapcraft upload-metadata "$SNAP_FILE" --force
          else
            echo "No snap package found in dist/"
            exit 1
          fi