name: Release

on:
  release:
    types: [created]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Added darwin/arm64 to support modern Apple Silicon Macs
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: arm64
            goos: windows
          - goarch: "386"
            goos: linux # Optional: removes linux 32-bit if you don't need it
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1.55
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          goversion: go.mod
          binary_name: "terrakube"
          ldflags: -s -w -X terrakube/cmd.Version=${{ github.event.release.tag_name }} -X terrakube/cmd.Commit=${{ github.sha }} -X terrakube/cmd.Date=${{ github.event.release.published_at || github.event.release.created_at }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Publish to Docker Hub
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            docker.io/azbuilder/terrakube-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.release.published_at || github.event.release.created_at }}

  snap:
    name: Build and Publish Snap Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Snapcraft Channel and Version
        id: channel
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ -rc ]]; then
            CHANNEL="latest/candidate"
          elif [[ "$TAG" =~ -beta ]]; then
            CHANNEL="latest/beta"
          elif [[ "$TAG" =~ -alpha ]] || [[ "$TAG" =~ - ]]; then
            CHANNEL="latest/edge"
          else
            CHANNEL="latest/stable"
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG -> Version: $VERSION -> Snap Channel: $CHANNEL"

      - name: Build Snap Package
        id: build
        uses: canonical/action-build@v1
        with:
          path: .
        env:
          RELEASE_VERSION: ${{ steps.channel.outputs.version }}

      - name: Publish Snap Package to Snap Store
        uses: canonical/action-publish@v1
        with:
          store_login: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          snap: ${{ steps.build.outputs.snap }}
          channel: ${{ steps.channel.outputs.channel }}