name: Release

on:
  release:
    types: [created]

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Determine Snap Channel
        id: channel
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ -rc ]]; then
            CHANNEL="latest/candidate"
          elif [[ "$TAG" =~ -beta ]]; then
            CHANNEL="latest/beta"
          elif [[ "$TAG" =~ - ]]; then
            CHANNEL="latest/edge"
          else
            CHANNEL="latest/stable"
          fi
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG -> Snap Channel: $CHANNEL"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Put choco on PATH
        run: echo "$GITHUB_WORKSPACE/.github/scripts" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes Formula/terrakube.rb to terrakube-io/homebrew-cli.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          GORELEASER_SNAP_CHANNEL: ${{ steps.channel.outputs.channel }}

      - name: Update Snap Store Metadata
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          SNAP_FILE=$(find dist/ -name "*.snap" | head -n 1)
          if [ -n "$SNAP_FILE" ]; then
            echo "Uploading metadata from: $SNAP_FILE"
            snapcraft upload-metadata "$SNAP_FILE" --force
          else
            echo "No snap package found in dist/"
            exit 1
          fi

      - name: Keep the Chocolatey package for the push job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chocolatey-package
          path: dist/*.nupkg
          if-no-files-found: error

  chocolatey:
    name: Chocolatey
    needs: goreleaser
    # The Linux choco (on Mono) builds the package fine, but every push from it
    # got 504 from push.chocolatey.org, so push with the native Windows client.
    # Re-running this job alone retries the push with the same package.
    runs-on: windows-latest
    permissions: {}
    steps:
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chocolatey-package

      - name: Push the package
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Filter '*.nupkg' | Select-Object -First 1
          if (-not $pkg) { throw 'no .nupkg downloaded' }
          foreach ($attempt in 1..3) {
            $out = choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -eq 0) { exit 0 }
            # A retry after a timeout can find the package already uploaded.
            if ($out -match '409') { Write-Host 'The package is already on Chocolatey.'; exit 0 }
            Write-Host "Attempt $attempt failed."
            if ($attempt -lt 3) { Start-Sleep -Seconds 60 }
          }
          throw "Pushing $($pkg.Name) to Chocolatey failed"

  packslip:
    name: packslip
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload packslip.sigstore.json to the release
      id-token: write # sign keylessly with this workflow's identity
      attestations: write # build provenance for each archive
    steps:
      - name: Sign the release archives
        uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          download: terrakube_*_*.tar.gz terrakube_*_*.zip
          bin: terrakube
