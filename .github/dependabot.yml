version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # All codeql-action steps must share one version or CodeQL fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
