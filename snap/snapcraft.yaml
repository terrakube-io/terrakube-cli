name: terrakube-cli
title: Terrakube CLI
base: core24
adopt-info: terrakube-cli
summary: Manage Terrakube organizations, workspaces, teams, and IaC jobs
description: |
  Terrakube CLI is the official command-line interface for Terrakube, the
  open-source self-hosted platform for infrastructure-as-code automation.

  Use it to:

  - Authenticate against your Terrakube server
  - Manage organizations, teams, and access permissions
  - Create and configure workspaces for Terraform / OpenTofu execution
  - Trigger and inspect plan, apply, and destroy jobs
  - Manage workspace variables, tags, and remote state
  - Set up notifications for Slack, Microsoft Teams, and webhooks

  Full documentation: https://docs.terrakube.io/user-guide/terrakube-cli
license: Apache-2.0
website: https://terrakube.io
contact: mailto:snap@terrakube.io
issues: https://github.com/terrakube-io/terrakube-cli/issues
source-code: https://github.com/terrakube-io/terrakube-cli

grade: stable
confinement: strict

apps:
  terrakube-cli:
    command: bin/terrakube
    plugs:
      - home
      - network

parts:
  terrakube-cli:
    plugin: go
    source: .
    build-snaps:
      - go/latest/stable
    override-build: |
      RAW_TAG="${RELEASE_VERSION:-$(git describe --tags --always 2>/dev/null || echo '0.0.0')}"
      CLEAN_VERSION="${RAW_TAG#v}"
      COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
      BUILD_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
      craftctl set version="${CLEAN_VERSION}"
      go build -ldflags="-s -w -X terrakube/cmd.Version=${CLEAN_VERSION} -X terrakube/cmd.Commit=${COMMIT} -X terrakube/cmd.Date=${BUILD_DATE}" -o "${CRAFT_PART_INSTALL}/bin/terrakube" .

